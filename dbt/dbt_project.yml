name: brand_health
version: "0.1.0"
profile: brand_health
config-version: 2
seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
vars:
  brand_regex: '(?i)(\bvivo\b)'   # aspas simples: barra literal no YAML
  brand_term: "operadora vivo"
models:
  brand_health:
    staging:      {+materialized: view,  +schema: stg}
    intermediate: {+materialized: view,  +schema: int}
    marts:        {+materialized: table, +schema: mart}
