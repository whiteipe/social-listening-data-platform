<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b45309"/>
    </marker>
    <style>
      .t{font-size:14px;fill:#0f172a}
      .s{font-size:12px;fill:#475569}
      .h{font-size:13px;font-weight:700;fill:#0f172a;letter-spacing:.04em}
      .built{fill:#d1fae5;stroke:#047857;stroke-width:1.6}
      .plan{fill:#f8fafc;stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 4}
      .off{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:3 4}
      .synb{fill:#fef3c7;stroke:#b45309;stroke-width:1.6}
      .syn{fill:#fef3c7;stroke:#b45309;stroke-width:1.4;stroke-dasharray:6 4}
      .zone{fill:none;stroke:#cbd5e1;stroke-width:1}
      .ar{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .arp{stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#g)}
      .aro{stroke:#b45309;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#o)}
    </style>
  </defs>
  <rect width="1280" height="780" fill="#ffffff"/>

  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Social Listening Data Platform: fluxo de dados da stack</text>
  <text x="30" y="58" class="s">Estado após o gerador sintético (Fase 1 + dados de teste). Verde = existe e testado. Tracejado = planejado.</text>

  <!-- orchestration band -->
  <rect x="270" y="78" width="760" height="34" rx="6" class="plan"/>
  <text x="650" y="100" text-anchor="middle" class="t">GitHub Actions cron (a decidir na Fase 4): coletores → classify → dbt build → alert</text>

  <!-- column headers -->
  <text x="30" y="144" class="h">FONTES</text>
  <text x="290" y="144" class="h">COLETA (PYTHON)</text>
  <text x="540" y="144" class="h">CARGA</text>
  <text x="790" y="144" class="h">BIGQUERY (DATASET ÚNICO)</text>
  <text x="1085" y="144" class="h">ENTREGA</text>

  <!-- sources -->
  <rect x="30" y="156" width="210" height="52" rx="8" class="plan"/>
  <text x="46" y="178" class="t">YouTube Data API</text><text x="46" y="196" class="s">vídeos + comentários, ~610 un./exec.</text>
  <rect x="30" y="218" width="210" height="52" rx="8" class="plan"/>
  <text x="46" y="240" class="t">Google News RSS</text><text x="46" y="258" class="s">notícias pt-BR, não oficial</text>
  <rect x="30" y="280" width="210" height="52" rx="8" class="plan"/>
  <text x="46" y="302" class="t">Google Trends (trendspyg)</text><text x="46" y="320" class="s">relativo 0 a 100, engine auto (0,8 s)</text>
  <rect x="30" y="342" width="210" height="62" rx="8" class="off"/>
  <text x="46" y="364" class="s">GSC + GA4 reais: não existem</text><text x="46" y="382" class="s">(Projeto 1 sem dados); por isso</text><text x="46" y="397" class="s">o gerador sintético ao lado</text>
  <rect x="30" y="414" width="210" height="52" rx="8" class="off"/>
  <text x="46" y="436" class="s">Fora da v1: Reddit, X, Instagram</text><text x="46" y="454" class="s">Backlog (Fase 7): Apify, GDELT</text>

  <!-- collectors -->
  <rect x="290" y="156" width="200" height="176" rx="10" class="built"/>
  <text x="304" y="178" class="t" font-weight="700">src/collectors/*.py</text>
  <text x="304" y="198" class="s">YouTube, News, Trends reais; 4 stubs</text>
  <text x="304" y="214" class="s">filtro de relevância (F1 0,94) + BR/pt</text>
  <text x="304" y="240" class="t">common/http.py</text><text x="304" y="257" class="s">retry + backoff (tenacity)</text>
  <text x="304" y="283" class="t">cli.py (typer)</text><text x="304" y="300" class="s">collect | classify | alert</text>
  <text x="304" y="318" class="s">--dry-run → data/dry_run/*.jsonl</text>

  <!-- synthetic generator -->
  <rect x="290" y="352" width="200" height="132" rx="10" class="synb"/>
  <text x="304" y="374" class="t" font-weight="700">scripts/synthetic_data.py</text>
  <text x="304" y="394" class="s">2 cenários: realistic e lag3</text>
  <text x="304" y="410" class="s">150 dias, seed fixo, só local</text>
  <text x="304" y="426" class="s">GA4 bruto aninhado: 149 tabelas,</text>
  <text x="304" y="442" class="s">173 mil eventos (ga4/*.jsonl.gz)</text>
  <text x="304" y="462" class="s">+ GSC, menções, labels, Trends</text>
  <text x="304" y="478" class="s">saída: data/synthetic/ (git ignora)</text>

  <!-- load -->
  <rect x="540" y="156" width="200" height="86" rx="10" class="built"/>
  <text x="554" y="178" class="t" font-weight="700">schema.make_row()</text>
  <text x="554" y="198" class="s">tudo em UTC, date = DATE</text>
  <text x="554" y="214" class="s">author_hash = sha256(sal:id)</text>
  <text x="554" y="230" class="s">nunca o id real (LGPD)</text>

  <rect x="540" y="262" width="200" height="104" rx="10" class="built"/>
  <text x="554" y="284" class="t" font-weight="700">bq.upsert()</text>
  <text x="554" y="304" class="s">1. dedupe pela chave natural</text>
  <text x="554" y="320" class="s">2. load em _stg_ temporária</text>
  <text x="554" y="336" class="s">3. MERGE (idempotente)</text>
  <text x="554" y="352" class="s">4. apaga a temporária (finally)</text>

  <!-- classifier -->
  <rect x="540" y="400" width="200" height="104" rx="10" class="plan"/>
  <text x="554" y="422" class="t" font-weight="700">nlp/classify.py (Fase 3)</text>
  <text x="554" y="442" class="s">só menções sem label</text>
  <text x="554" y="458" class="s">bake-off: Laya vs estilo JEV</text>
  <text x="554" y="474" class="s">vs baseline XLM-R</text>
  <text x="554" y="490" class="s">validação: 100+ rótulos manuais</text>
  <text x="554" y="518" class="s">lê mentions; grava mention_labels</text>

  <!-- bigquery zone -->
  <rect x="780" y="156" width="270" height="574" rx="12" class="zone"/>
  <text x="794" y="176" class="s">SEU_PROJETO_GCP.social_listening_data_platform</text>

  <rect x="796" y="190" width="238" height="112" rx="10" class="built"/>
  <text x="810" y="212" class="t" font-weight="700">RAW real (criado, vazio)</text>
  <text x="810" y="232" class="s">mentions · social_daily</text>
  <text x="810" y="250" class="s">trends_daily · mention_labels</text>
  <text x="810" y="270" class="s">chave natural + _loaded_at</text>
  <text x="810" y="288" class="s">reprocessa janela de 2 dias</text>

  <rect x="796" y="312" width="238" height="86" rx="10" class="syn"/>
  <text x="810" y="334" class="t" font-weight="700">RAW sintético (carga futura)</text>
  <text x="810" y="352" class="s">events_YYYYMMDD ×149 (GA4 aninhado)</text>
  <text x="810" y="368" class="s">searchdata_* (GSC, simplificado)</text>
  <text x="810" y="386" class="s">sandbox, nunca no dataset real</text>

  <rect x="796" y="408" width="238" height="88" rx="10" class="plan"/>
  <text x="810" y="430" class="t" font-weight="700">stg_* (views, dbt)</text>
  <text x="810" y="448" class="s">GA4: sessão = (user_pseudo_id,</text>
  <text x="810" y="464" class="s">ga_session_id); meio via event_params,</text>
  <text x="810" y="480" class="s">não traffic_source (first touch)</text>

  <rect x="796" y="506" width="238" height="50" rx="10" class="plan"/>
  <text x="810" y="528" class="t" font-weight="700">int_* (views, dbt)</text>
  <text x="810" y="546" class="s">menções + labels (sentimento, tema)</text>

  <rect x="796" y="566" width="238" height="150" rx="10" class="plan"/>
  <text x="810" y="588" class="t" font-weight="700">mart_* (tabelas, dbt)</text>
  <text x="810" y="606" class="s">daily_brand_health (1 linha/dia)</text>
  <text x="810" y="622" class="s">sov_weekly · topics_sentiment</text>
  <text x="810" y="638" class="s">lag_correlation (0 a 14 dias)</text>
  <text x="810" y="654" class="s">campaign_impact</text>
  <text x="810" y="670" class="s">crisis_alerts (z &gt; 2, janela 28d)</text>
  <text x="810" y="696" class="s">dbt freshness + testes</text>

  <!-- outputs -->
  <rect x="1085" y="566" width="170" height="64" rx="10" class="plan"/>
  <text x="1099" y="588" class="t" font-weight="700">Looker Studio</text>
  <text x="1099" y="606" class="s">6 páginas (Fase 6)</text>
  <text x="1099" y="622" class="s">montado manualmente</text>
  <rect x="1085" y="650" width="170" height="64" rx="10" class="plan"/>
  <text x="1099" y="672" class="t" font-weight="700">Alerta Slack</text>
  <text x="1099" y="690" class="s">negativas &gt; 2 desvios</text>
  <text x="1099" y="706" class="s">webhook (Fase 5)</text>

  <!-- arrows: sources -> collectors -->
  <path d="M240 182 H290" class="arp"/>
  <path d="M240 244 H290" class="arp"/>
  <path d="M240 306 H290" class="arp"/>
  <!-- collectors -> make_row -> upsert -> raw real -->
  <path d="M490 200 H540" class="ar"/>
  <path d="M640 242 V262" class="ar"/>
  <path d="M740 270 H796" class="ar"/>
  <!-- classify lê e grava no raw real -->
  <path d="M796 300 H776 V430 H740" class="arp"/>
  <path d="M740 480 H758 V292 H796" class="arp"/>
  <!-- generator -> raw sintético (carga futura, pelo rodapé) -->
  <path d="M390 484 V752 H1066 V355 H1034" class="aro"/>
  <text x="400" y="744" class="s">carga futura no sandbox (a configurar junto com o dbt)</text>
  <!-- raw -> stg -> int -> mart -->
  <path d="M1034 246 H1046 V440 H1034" class="arp"/>
  <path d="M915 398 V408" class="arp"/>
  <path d="M915 496 V506" class="arp"/>
  <path d="M915 556 V566" class="arp"/>
  <!-- mart -> outputs -->
  <path d="M1034 598 H1085" class="arp"/>
  <path d="M1034 682 H1085" class="arp"/>

  <!-- legend -->
  <rect x="30" y="520" width="18" height="12" class="built"/><text x="56" y="531" class="s">existe e testado</text>
  <rect x="30" y="544" width="18" height="12" class="synb"/><text x="56" y="555" class="s">sintético, gerado (local)</text>
  <rect x="30" y="568" width="18" height="12" class="syn"/><text x="56" y="579" class="s">sintético, carga futura</text>
  <rect x="30" y="592" width="18" height="12" class="plan"/><text x="56" y="603" class="s">planejado</text>
  <rect x="30" y="616" width="18" height="12" class="off"/><text x="56" y="627" class="s">fora da v1 / inexistente</text>
  <text x="30" y="660" class="s">Dry-run real: YouTube, News, Trends.</text>
  <text x="30" y="676" class="s">Nada gravado no BigQuery além dos</text>
  <text x="30" y="692" class="s">DDLs: as 4 tabelas raw estão vazias.</text>
</svg>
