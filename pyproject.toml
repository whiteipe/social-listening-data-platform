[project]
name = "brand-health-listening"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # asserts com literais longos
"scripts/synthetic_*.py" = ["E501"]  # tabelas de parâmetros e schema
